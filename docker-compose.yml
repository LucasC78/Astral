services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: astral
      POSTGRES_USER: astral
      POSTGRES_PASSWORD: astral
    ports:
      - "5432:5432"
    volumes:
      - astral_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astral -d astral"]
      interval: 5s
      timeout: 3s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: change-me-meili-master
    ports:
      - "7700:7700"
    volumes:
      - astral_meili:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  astral_pgdata:
  astral_meili:
